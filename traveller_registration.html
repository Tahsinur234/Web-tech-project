<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BhromonShathi Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>BhromonShathi.Com</h1>
        <h2>Traveler Registration Form</h2>
        <form id="myForm" novalidate>

            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Write your name">
                <span class="error" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="Write your email">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Write your password">
                <span class="error" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="NID">NID:</label>
                <input type="text" id="NID" placeholder="Write Your NID Number">
                <span class="error" id="nidError"></span>
            </div>

            <div class="form-group">
                <label for="Phone">Phone:</label>
                <input type="text" id="Phone" placeholder="Write Your Phone Number">
                <span class="error" id="phoneError"></span>
            </div>

            <div class="form-group">
                <label for="dob">Date of birth:</label>
                <input type="date" id="dob">
                <span class="error" id="dobError"></span>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="options">
                    <label><input type="radio" name="Gender" value="Male"> Male</label>
                    <label><input type="radio" name="Gender" value="Female">Female</label>
                    <label><input type="radio" name="Gender" value="Others">Others</label>
                </div>
                <span class="error" id="genderError"></span>
            </div>

            <div class="form-group">
                <label>Nationality:</label>
                <div class="options">

                    <label><input type="radio" name="Nationality" value="Bangladeshi">Bangladeshi</label>
                    <label><input type="radio" name="Nationality" value="Foreigner">Foreigner</label>
                 </div>
                <span class="error" id="nationalityError"></span>
            </div>

            <div class="form-group">
                <label for="address">Present Address:</label>
                <textarea id="address" rows="3" placeholder="Enter your present address"></textarea>
                <span class="error" id="addressError"></span>
            </div>

            <div class="form-group">
                <label for="postal">Postal Code:</label>
                <input type="text" id="postal" placeholder="Enter your postal code">
                <span class="error" id="postalError"></span>
            </div>

            <button type="submit" class="register">Register</button>
            <button type="reset" class="reset">Reset</button>
            <p class="account-link">
    Already have an account?
    <a href="login.html">Login Here</a>
</p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
