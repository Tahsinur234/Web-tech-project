<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <h1>BhromonShathi.Com</h1>
    <h2>Traveler Registration Form</h2>
    <form>
        <label for = "name"> Full Name: </label>
        <input type = "text" name="name" id ="name" placeholder="write your name" required> <br><br>
        <label for = "email"> Email: </label>
        <input type = "email" email="email" id="email" placeholder="write your email" required> <br><br>
         <label for = "password"> Password: </label>
        <input type = "password" password="password" id="password" placeholder="write your password" required> <br><br>
          <label for = "NID"> NID: </label>
        <input type = "number" number="NID" id="NID" placeholder="Write Your NID Number" required> <br><br> 
       <label for = "Phone"> Phone: </label>
        <input type = "number" number="Phone" id="Phone" placeholder="Write Your Phone Number" required> <br><br> 
         <label for = "dob"> Date of birth: </label>
        <input type = "date" dob="dob" id ="dob" placeholder="select your date of birth" > <br><br>
        <label > Gender: </label>
        <input type="radio" name="Gender" value="male"> Male
         <input type="radio" name="Gender" value="female"> Female
          <input type="radio" name="Gender" value="others"> Others <Br><br>
            <label > Nationality: </label>
        <input type="radio" name="Nationality" value="Bangladeshi"> Bangladeshi
         <input type="radio" name="Nationality" value="Foreigner"> Foreigner <Br><br>
              <label >Present Address: </label><br>
              <textarea rows="2" cols="30"></textarea><br><br>
              <label for = "postal code"> Postal Code: </label>
        <input type = "number" postal code="postal code" id="postal code"> <br><br>
              <input type="submit" value="Register">
                   <input type="reset" value="Reset">

    </form>
    </center>
</body>
