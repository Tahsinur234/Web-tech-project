
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - BhromonShathi.Com</title>
    <link rel="stylesheet" href="admin-register.css">
</head>
<body>

    <div class="container">

        <h1>BhromonShathi.Com</h1>
        <h2>Admin Registration</h2>
        <p class="subtitle">Create your administrator account</p>

        <form id="adminForm" novalidate>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="adminName" placeholder="Enter your full name">
                <span class="error" id="adminNameError"></span>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="adminEmail" placeholder="Enter your email">
                <span class="error" id="adminEmailError"></span>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password">
                <span class="error" id="adminPasswordError"></span>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="adminPhone" placeholder="01XXXXXXXXX">
                <span class="error" id="adminPhoneError"></span>
            </div>

            <div class="form-group">
                <label>Admin ID</label>
                <input type="text" id="adminId" placeholder="Enter authorized Admin ID">
                <span class="error" id="adminIdError"></span>
            </div>

            <div class="form-group">
                <label>Security Code</label>
                <input type="password" id="securityCode" placeholder="Enter authorization code">
                <span class="error" id="securityCodeError"></span>
            </div>

            <div class="buttons">
                <button type="submit">Register as Admin</button>
                <button type="reset" class="reset">Reset</button>
            </div>

            <p class="account-link">
                Already have an account?
                <a href="login.html">Login Here</a>
            </p>

        </form>

    </div>

    <script src="admin-register.js"></script>
</body>
</html>
